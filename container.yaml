version: v1alpha
type: app
name: smart-claims-app
title: Smart Claims App
description: Smart Claims App to view and manage claims.
owner: aishwaryasharmatmdcio
tags:
  - smart-claims
  - automation
spec:
  compute: onboarding
  runAsUser: aishwaryasharmatmdcio
  logLevel: INFO
  replicas: 1
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
    limits:
      cpu: 2000m
      memory: 4Gi
  service:
    type: node-js
    image: tmdcio/ssa_claims_app:0.1
    imagePullSecret: modern-docker-image-pull-secret
    command:
      - npm
    arguments:
      - start
    port: 4000
    envs:
      NODE_ENV: production
      APP_ENV: prod
      PORT: "4000"
      SEMANTIC_API_URL: "https://leidos-sandbox.instance.dataos.cloud/vulcan/tenants/onboarding/data-products/onboarding-ssa-claims-prod"
      SEMANTIC_CONCURRENCY: "3"
      SEMANTIC_PAGE_SIZE: "50000"
      SEMANTIC_POLL_TIMEOUT_MS: "120000"
      CACHE_TTL_MS: "3600000"
      BASE_PATH: /smart-claims
    hostname: smart-claims
    stateful: false
    http:
      stripPath: false
      path: /smart-claims
      noNetworkAuthorization: true
      ingress:
        enabled: true
        path: /smart-claims
        stripPath: false
        appDetailSpec: smart-claims
  app:
    icon: "data:image/svg+xml;base64,"
    domain: platform
    description: Customer health app to spot at-risk accounts, understand satisfaction drivers, and act on Pulse insights.
    tags:
      - smart-claims
    owners:
      - aishwaryasharmatmdcio
    products:
      - ssa-claims-prod
    references:
      - title: Bitbucket Link
        url: https://bitbucket.org/rubik_/ssa_claims/src/main/
    link:
      title: Open app
      url: https://leidos-sandbox.instance.dataos.cloud/smart-claims